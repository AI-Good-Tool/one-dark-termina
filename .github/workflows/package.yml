name: Package desktop apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            artifact: macos-arm64
            package: dmg/*.dmg
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
            package: nsis/*-setup.exe
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: npm ci
      - name: Build installer
        run: npm run tauri build -- --ci --target ${{ matrix.target }} -- --locked
      - uses: actions/upload-artifact@v7
        with:
          name: one-dark-terminal-${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.package }}
          if-no-files-found: error
